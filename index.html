<!doctype html>
<html lang="en" data-theme="signal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>SONIQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffd60a'/%3E%3C/svg%3E">
<style>
/* SONIQ: flat "hardware" look. Bold device colours, speaker-grille dots, a click wheel, reels.
   Themes are popular solid colours; each defines device colour + ink so contrast stays high. */

:root,
:root[data-theme='signal'] {
  --device: #ffd60a;
  --ink: #111111;
  --ink-2: rgba(17, 17, 17, 0.55);
  --chip: rgba(17, 17, 17, 0.08);
  --chip-strong: rgba(17, 17, 17, 0.14);
  --wheel: #111111;
  --wheel-ink: #ffd60a;
}
:root[data-theme='tangerine'] {
  --device: #ff7a1a;
  --ink: #160c05;
  --ink-2: rgba(22, 12, 5, 0.58);
  --chip: rgba(22, 12, 5, 0.09);
  --chip-strong: rgba(22, 12, 5, 0.16);
  --wheel: #160c05;
  --wheel-ink: #ff7a1a;
}
:root[data-theme='mint'] {
  --device: #9be3c3;
  --ink: #0d1f18;
  --ink-2: rgba(13, 31, 24, 0.58);
  --chip: rgba(13, 31, 24, 0.08);
  --chip-strong: rgba(13, 31, 24, 0.15);
  --wheel: #0d1f18;
  --wheel-ink: #9be3c3;
}
:root[data-theme='cobalt'] {
  --device: #2f5bff;
  --ink: #ffffff;
  --ink-2: rgba(255, 255, 255, 0.7);
  --chip: rgba(255, 255, 255, 0.14);
  --chip-strong: rgba(255, 255, 255, 0.24);
  --wheel: #0b1650;
  --wheel-ink: #ffffff;
}
:root[data-theme='coral'] {
  --device: #ff6f61;
  --ink: #1a0b09;
  --ink-2: rgba(26, 11, 9, 0.58);
  --chip: rgba(26, 11, 9, 0.09);
  --chip-strong: rgba(26, 11, 9, 0.16);
  --wheel: #1a0b09;
  --wheel-ink: #ff6f61;
}
:root[data-theme='oat'] {
  --device: #d9d2c5;
  --ink: #141210;
  --ink-2: rgba(20, 18, 16, 0.5);
  --chip: rgba(20, 18, 16, 0.08);
  --chip-strong: rgba(20, 18, 16, 0.14);
  --wheel: #141210;
  --wheel-ink: #d9d2c5;
}

:root {
  --page: #efede8;
  --panel: #fbfaf7;
  --panel-ink: #141414;
  --panel-ink-2: #6f6c66;
  --line: rgba(0, 0, 0, 0.09);
  --ok: #1f9d55;
  --warn: #b26b00;
  --bad: #c0362c;
  --radius-device: 40px;
  --radius-card: 22px;
  --font: 'Inter', 'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mode='light']) {
    --page: #121212;
    --panel: #1c1c1c;
    --panel-ink: #f2f2f2;
    --panel-ink-2: #9a9a9a;
    --line: rgba(255, 255, 255, 0.1);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--panel-ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.4;
}
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 3px solid #4c8dff; outline-offset: 2px; border-radius: 8px; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  max-width: 1280px; margin: 0 auto; padding: 18px 16px 6px;
}
.brand { font-weight: 900; font-size: 22px; letter-spacing: -0.04em; display: flex; align-items: center; gap: 10px; }
.brand-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--device); box-shadow: inset 0 0 0 5px var(--wheel); }
.nav { display: flex; gap: 6px; background: var(--panel); padding: 5px; border-radius: 999px; border: 1px solid var(--line); }
.nav a { text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.nav a[aria-current='page'] { background: var(--device); color: var(--ink); }
.themes { display: flex; gap: 8px; align-items: center; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.swatch[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--panel-ink); }

main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 48px; }

/* ---------- layout ---------- */
.split { display: grid; grid-template-columns: 400px 1fr; gap: 20px; align-items: start; }
@media (max-width: 960px) { .split { grid-template-columns: 1fr; } }

/* ---------- the device ---------- */
.device {
  background: var(--device); color: var(--ink);
  border-radius: var(--radius-device); padding: 26px 24px 24px;
  position: sticky; top: 12px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 20px 40px -24px rgba(0,0,0,0.35);
}
@media (max-width: 960px) { .device { position: static; } }
.device-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.title-xl { font-size: 32px; line-height: 1; font-weight: 850; letter-spacing: -0.045em; margin: 0; }
.title-xl .sub { display: block; color: var(--ink-2); }

.round-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--chip);
  display: inline-grid; place-items: center; color: var(--ink); flex: none;
}
.round-btn:hover:not(:disabled) { background: var(--chip-strong); }
.round-btn.sm { width: 34px; height: 34px; }

/* speaker grille */
.grille-wrap { display: grid; place-items: center; margin: 22px 0 18px; }
.grille {
  width: min(78vw, 290px); aspect-ratio: 1; border-radius: 50%;
  background: var(--chip);
  position: relative; overflow: hidden;
}
.grille::before {
  content: ''; position: absolute; inset: 14px; border-radius: 50%;
  background-image: radial-gradient(circle, var(--ink) 0 3.6px, transparent 4.2px);
  background-size: 17px 17px; background-position: center;
  -webkit-mask: radial-gradient(circle, #000 69%, transparent 70.5%);
          mask: radial-gradient(circle, #000 69%, transparent 70.5%);
}
.grille.busy::before { animation: grille 0.9s ease-in-out infinite alternate; }
@keyframes grille { from { transform: scale(0.97); opacity: 0.55; } to { transform: scale(1.02); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .grille.busy::before { animation: none; opacity: 0.6; } }
.grille-screen { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
.grille-screen iframe { width: 100%; height: 100%; border: 0; border-radius: 50%; background: #000; }
.grille-label {
  position: absolute; bottom: 16%; left: 50%; transform: translateX(-50%);
  background: var(--device); color: var(--ink); font-family: var(--mono); font-size: 11px;
  padding: 3px 8px; border-radius: 999px; z-index: 2; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
}

/* search */
.search { display: flex; gap: 8px; align-items: stretch; }
.search textarea {
  flex: 1; resize: none; border: 0; border-radius: 22px; padding: 12px 16px;
  background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; min-height: 64px;
}
.search textarea::placeholder { color: var(--ink-2); }
.go {
  border: 0; border-radius: 22px; background: var(--wheel); color: var(--wheel-ink);
  font-weight: 800; padding: 0 18px; letter-spacing: -0.01em;
}
.parsed { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; min-height: 26px; }
.tag { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: var(--chip); font-weight: 600; }

/* click wheel */
.wheel-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; }
.wheel {
  width: 230px; height: 230px; border-radius: 50%; background: var(--wheel);
  position: relative; margin: 0 auto; color: var(--wheel-ink);
}
.wheel button { position: absolute; border: 0; background: transparent; color: var(--wheel-ink); display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; }
.wheel button:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
.wheel .w-top { top: 6px; left: 50%; transform: translateX(-50%); }
.wheel .w-bottom { bottom: 6px; left: 50%; transform: translateX(-50%); }
.wheel .w-left { left: 6px; top: 50%; transform: translateY(-50%); }
.wheel .w-right { right: 6px; top: 50%; transform: translateY(-50%); }
.wheel .w-center {
  width: 92px; height: 92px; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--device); color: var(--ink);
}
.wheel .w-center:hover:not(:disabled) { background: var(--device); filter: brightness(1.05); }
.wheel-caption { text-align: center; font-size: 12px; color: var(--ink-2); margin-top: 10px; min-height: 18px; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border-radius: var(--radius-card); border: 1px solid var(--line); padding: 18px; }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.h2 { font-size: 22px; font-weight: 850; letter-spacing: -0.035em; margin: 0; }
.h2 .sub { color: var(--panel-ink-2); font-weight: 700; }
.muted { color: var(--panel-ink-2); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); }
.notice { border-radius: 14px; padding: 10px 12px; font-size: 13px; background: color-mix(in srgb, var(--device) 22%, var(--panel)); margin-bottom: 10px; }
.notice.bad { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--panel-ink-2); margin-bottom: 12px; align-items: center; }

/* provenance badges */
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; margin-left: 4px; vertical-align: 1px; white-space: nowrap; }
.b-provider { background: rgba(31,157,85,0.14); color: var(--ok); }
.b-measured { background: rgba(31,157,85,0.14); color: var(--ok); }
.b-file-tag { background: rgba(76,141,255,0.14); color: #3a6fd8; }
.b-uploader-stated { background: rgba(178,107,0,0.14); color: var(--warn); }
.b-estimate { background: rgba(160,80,220,0.14); color: #8a44c4; }

/* tracks */
.tracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.track {
  display: grid; grid-template-columns: auto 64px 1fr auto; gap: 12px; align-items: center;
  padding: 10px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel);
}
.track.current { border-color: var(--panel-ink); box-shadow: 0 0 0 2px var(--device); }
.art { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--device); display: block; }
.art.ph { background-image: radial-gradient(circle, var(--ink) 0 2px, transparent 2.6px); background-size: 9px 9px; background-color: var(--device); }
.t-title { font-weight: 750; letter-spacing: -0.015em; line-height: 1.2; }
.t-meta { font-size: 12.5px; color: var(--panel-ink-2); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.t-chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--line); font-weight: 600; }
.t-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.match { font-family: var(--mono); font-weight: 700; font-size: 18px; letter-spacing: -0.03em; }
.match small { font-size: 10.5px; color: var(--panel-ink-2); font-weight: 500; display: block; text-align: right; letter-spacing: 0; }
.actions { display: flex; gap: 6px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; }
.icon-btn:hover:not(:disabled) { background: var(--line); }
.why { grid-column: 2 / -1; font-size: 12px; color: var(--panel-ink-2); }
.why ul { margin: 6px 0 0; padding-left: 16px; }
@media (max-width: 640px) {
  .track { grid-template-columns: auto 48px 1fr; }
  .art { width: 48px; height: 48px; }
  .t-side { grid-column: 2 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
}
.check { width: 18px; height: 18px; accent-color: #111; }

/* buttons */
.btn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; background: var(--line); }
.btn.primary { background: var(--wheel); color: var(--wheel-ink); }
.btn.accent { background: var(--device); color: var(--ink); }
.btn:hover:not(:disabled) { filter: brightness(0.96); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-weight: 650; font-size: 13px; }
.tab[aria-pressed='true'] { background: var(--panel-ink); color: var(--panel); border-color: var(--panel-ink); }
select, input[type='number'] { font: inherit; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--panel-ink); }

.pl-list { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: pl; }
.pl-list li { display: grid; grid-template-columns: 28px 1fr auto auto; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); align-items: center; font-size: 14px; }
.pl-list li::before { counter-increment: pl; content: counter(pl); font-family: var(--mono); color: var(--panel-ink-2); font-size: 12px; }

/* ---------- studio ---------- */
.reels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 20px 0 14px; }
.reel-box { display: grid; place-items: center; gap: 8px; }
.reel { width: 100%; max-width: 150px; aspect-ratio: 1; border-radius: 50%; background: var(--chip-strong); display: grid; place-items: center; }
.reel svg { width: 74%; height: 74%; color: var(--ink); }
.reel.spin svg { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .reel.spin svg { animation: none; } }
.reel-label { font-size: 12px; font-weight: 700; text-align: center; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reel-sub { font-family: var(--mono); font-size: 11px; color: var(--ink-2); min-height: 14px; }

.wave { height: 84px; border-radius: 16px; background: var(--chip); position: relative; overflow: hidden; }
.wave .seg { position: absolute; height: 34px; border-radius: 8px; background: var(--wheel); color: var(--wheel-ink); font-size: 10.5px; font-weight: 700; padding: 3px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.wave .seg.alt { top: 44px; }
.wave .seg:not(.alt) { top: 6px; }
.wave .fade { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, transparent 0 3px, var(--chip-strong) 3px 4px); }
.wave .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.timecodes { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; margin-top: 6px; color: var(--ink-2); }

.transport { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
.big-btn { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--wheel); color: var(--wheel-ink); display: grid; place-items: center; }

.drop {
  border: 2px dashed var(--line); border-radius: 18px; padding: 18px; text-align: center; display: block;
}
.drop.on { border-color: var(--panel-ink); background: var(--line); }
.lib { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lib > li { border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.lib > li > .actions { align-self: start; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--panel-ink-2); margin-top: 4px; }
.stats b { color: var(--panel-ink); font-family: var(--mono); font-weight: 650; }
.rhythm { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; vertical-align: middle; }
.rhythm span { width: 4px; background: var(--panel-ink); border-radius: 1px; opacity: 0.8; }
.progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--panel-ink); }

.footer { max-width: 1280px; margin: 0 auto; padding: 0 16px 32px; font-size: 12px; color: var(--panel-ink-2); }
.footer a { color: inherit; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel-ink); color: var(--panel); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 600; z-index: 50; max-width: calc(100vw - 32px); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 640px) {
  .topbar { flex-wrap: wrap; }
  .nav a { white-space: nowrap; padding: 8px 12px; }
  .themes { order: 3; width: 100%; justify-content: center; }
  .device { padding: 22px 16px 20px; border-radius: 32px; }
  .wheel { width: 210px; height: 210px; }
}

</style>
</head>
